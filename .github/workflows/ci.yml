name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: jobbank
          # No hardcoded password: service containers start before any step
          # runs, so no step can generate a secret for them — instead every
          # credential in this job derives from github.run_id, unique per
          # run and never committed. The provision step below uses the same
          # values, so the app, migrator and role setup all agree.
          POSTGRES_PASSWORD: ci-pg-${{ github.run_id }}
          POSTGRES_DB: jobbank
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U jobbank -d jobbank"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgres://app_rw:ci-app-${{ github.run_id }}@localhost:5433/jobbank
      DATABASE_MIGRATOR_URL: postgres://jobbank:ci-pg-${{ github.run_id }}@localhost:5433/jobbank
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:8333
      S3_ACCESS_KEY_ID: ci-${{ github.run_id }}
      S3_SECRET_ACCESS_KEY: ci-${{ github.run_id }}
      S3_BUCKET: jobbank-documents
      S3_FORCE_PATH_STYLE: 'true'

    steps:
      - uses: actions/checkout@v4

      # Dependency-free gates: fail fast before installing anything.
      - name: Secret scan (tracked files)
        run: bash scripts/ci/secret-scan.sh

      - name: Migration consistency check
        run: node scripts/ci/check-migrations.mjs

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # Ephemeral test credentials, generated fresh per run and never committed.
      # The integration/Jest suites seed the test DB with SEED_DEV_PASSWORD and
      # sign in with it; nothing in the repo may contain a real value for it.
      - name: Generate ephemeral test credentials
        run: |
          echo "SEED_DEV_PASSWORD=$(openssl rand -base64 24)" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      # Mirrors the pg-init-roles config in docker-compose.yml (service containers can't take it).
      # Same per-run passwords as the service/job env above (github.run_id).
      - name: Provision database roles
        run: |
          PGPASSWORD=ci-pg-${{ github.run_id }} psql -h localhost -p 5433 -U jobbank -d jobbank -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_rw LOGIN PASSWORD 'ci-app-${{ github.run_id }}';
          GRANT CONNECT ON DATABASE jobbank TO app_rw;
          CREATE DATABASE jobbank_test OWNER jobbank;
          GRANT CONNECT ON DATABASE jobbank_test TO app_rw;
          SQL

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
