packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  esbuild: 0.25.12
  glob: 14.0.2
  minimatch: 11.0.1
  postcss: 8.5.33
# Dependencies allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  unrs-resolver: true
  '@playwright/browser-chromium': false
  protobufjs: false
  unix-dgram: false
# Packages pnpm's release-age policy flagged as too new; pinned on purpose.
minimumReleaseAgeExclude:
  - '@next/env@15.5.27'
  - '@next/eslint-plugin-next@15.5.27'
  - '@next/swc-darwin-arm64@15.5.27'
  - '@next/swc-darwin-x64@15.5.27'
  - '@next/swc-linux-arm64-gnu@15.5.27'
  - '@next/swc-linux-arm64-musl@15.5.27'
  - '@next/swc-linux-x64-gnu@15.5.27'
  - '@next/swc-linux-x64-musl@15.5.27'
  - '@next/swc-win32-arm64-msvc@15.5.27'
  - '@next/swc-win32-x64-msvc@15.5.27'
  - '@turbo/darwin-64@2.11.6'
  - '@turbo/darwin-arm64@2.11.6'
  - '@turbo/linux-64@2.11.6'
  - '@turbo/linux-arm64@2.11.6'
  - '@turbo/windows-64@2.11.6'
  - '@turbo/windows-arm64@2.11.6'
  - next@15.5.27
  - turbo@2.11.6
